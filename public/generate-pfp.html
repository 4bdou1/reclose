<!DOCTYPE html>
<html>
<head>
    <title>Generate REclose PFP</title>
</head>
<body style="background: #111; color: white; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h2>Generating your high-res REclose Profile Picture...</h2>
    <p>If the download doesn't start automatically, click the button below.</p>
    
    <canvas id="canvas" width="800" height="800" style="display:none;"></canvas>
    <img id="preview" style="width: 400px; height: 400px; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-top: 20px;" />
    
    <br><br>
    <button onclick="downloadPNG()" style="padding: 10px 20px; background: #3B82F6; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">Download PNG</button>

    <script>
        const svgString = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Dark background for the profile picture -->
                <rect width="100" height="100" fill="#050505" />
                
                <defs>
                    <linearGradient id="rc-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#4ADE80" />
                        <stop offset="50%" stop-color="#2DD4BF" />
                        <stop offset="100%" stop-color="#3B82F6" />
                    </linearGradient>
                </defs>
                
                <!-- Scaled and centered logo -->
                <g transform="translate(10, 15) scale(0.8)">
                    <path
                        d="M10 10H45C53 10 58 15 58 22C58 29 53 34 45 34H22V65M22 34H35L52 65"
                        stroke="url(#rc-gradient)"
                        stroke-width="10"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        fill="none"
                    />
                    <path
                        d="M85 20C90 28 90 45 85 55C78 68 62 70 52 65"
                        stroke="url(#rc-gradient)"
                        stroke-width="10"
                        stroke-linecap="round"
                        fill="none"
                    />
                </g>
            </svg>
        `;

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        const preview = document.getElementById('preview');
        let pngUrl = '';

        img.onload = function() {
            ctx.drawImage(img, 0, 0, 800, 800);
            pngUrl = canvas.toDataURL("image/png");
            preview.src = pngUrl;
            downloadPNG();
        };

        const svgBlob = new Blob([svgString], {type: "image/svg+xml;charset=utf-8"});
        const DOMURL = self.URL || self.webkitURL || self;
        const url = DOMURL.createObjectURL(svgBlob);
        img.src = url;

        function downloadPNG() {
            if (!pngUrl) return;
            const a = document.createElement('a');
            a.download = 'reclose-pfp.png';
            a.href = pngUrl;
            a.click();
        }
    </script>
</body>
</html>
